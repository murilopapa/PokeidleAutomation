# Instalador de TESTE: roda em qualquer push para uma branch "teste/..." e guarda o .exe como
# artefato do Actions (aba Actions → a execução → Artifacts). NÃO cria Release, então a
# atualização automática dos apps instalados não enxerga esta versão.
name: Instalador de teste
on:
  push:
    branches: ['teste/**']
  workflow_dispatch:
jobs:
  instalador:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-multiconta/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Gera o instalador
        run: sh tools/build-win.sh
      - name: Guarda o instalador
        uses: actions/upload-artifact@v4
        with:
          name: instalador-teste
          path: app-multiconta/app/dist/PokeIdle-Multi-Instalador-*.exe
          retention-days: 14
